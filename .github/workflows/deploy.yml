- name: Deploy to Server via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -T -q -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST << 'EOF'
            set -e

            echo "=== DEBUG INFO ==="
            echo "1. Current user: $(whoami)"
            echo "2. Current directory before cd: $(pwd)"
            echo "3. Value of DEPLOY_PATH variable: '${DEPLOY_PATH:-IS_EMPTY}'"
            echo "4. Checking parent directory contents:"
            ls -la /var/www/dexby102/data/www/premiumshoes.pp.ua/ || true
            echo "=================="

            # Пробуємо перейти
            cd "$DEPLOY_PATH"
            echo "Successfully changed directory to $(pwd)"

            # Решта твоїх команд...
            git pull origin main
            composer install --no-dev --optimize-autoloader --no-interaction
            npm install
            npm run build
            php artisan config:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan migrate --force
            chown -R www-data:www-data storage bootstrap/cache public/build
            chmod -R 775 storage bootstrap/cache
          EOF