- name: Deploy to Server via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Використовуємо -T щоб не вимагати псевдо-термінал і уникнути помилок tput
          ssh -T -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST << 'EOF'
            set -e # Зупинити виконання при першій же помилці
            
            # Переходимо в папку проєкту та перевіряємо чи вона існує
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "Successfully changed directory to $(pwd)"

            # 1. Оновлення коду з репозиторію
            git pull origin main

            # 2. Встановлення PHP-залежностей через Composer
            composer install --no-dev --optimize-autoloader --no-interaction

            # 3. Встановлення JS-залежностей та збірка фронтенду (Vite)
            npm install
            npm run build

            # 4. Очищення та кешування конфігурацій Laravel
            php artisan config:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # 5. Запуск міграцій бази даних
            php artisan migrate --force

            # 6. Виправлення прав доступу для папок storage, bootstrap/cache та public/build
            chown -R www-data:www-data storage bootstrap/cache public/build
            chmod -R 775 storage bootstrap/cache
          EOF