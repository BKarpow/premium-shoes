name: Deploy Laravel Application

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Встановлюємо sshpass для автоматичної авторизації за паролем
          sudo apt-get update && sudo apt-get install -y sshpass

          # Підключаємося та виконуємо команди деплою
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST << 'EOF'
            cd $DEPLOY_PATH

            # 1. Оновлення коду з репозиторію
            git pull origin main

            # 2. Встановлення PHP-залежностей через Composer
            composer install --no-dev --optimize-autoloader --no-interaction

            # 3. Очищення та кешування конфігурацій Laravel
            php artisan config:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # 4. Запуск міграцій бази даних
            php artisan migrate --force

            # 5. Виправлення прав доступу для папок storage та bootstrap/cache
            chown -R www-data:www-data storage bootstrap/cache
            chmod -R 775 storage bootstrap/cache
          EOF